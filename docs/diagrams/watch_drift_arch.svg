<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Segoe UI, system-ui, sans-serif" font-size="12">
  <title>Watch Drift architecture</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1625"/>
      <stop offset="100%" style="stop-color:#070b1a"/>
    </linearGradient>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="24" y="36" fill="#22d3ee" font-size="16" font-weight="bold">Watch Drift  system architecture</text>
  <text x="24" y="58" fill="#64748b" font-size="11">Next.js 14 ù NextAuth ù Google OAuth ù Prisma ù Neon (Postgres)</text>
  <!-- User -->
  <rect x="32" y="120" width="100" height="64" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="82" y="150" text-anchor="middle" fill="#e2e8f0" font-weight="600">User</text>
  <text x="82" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">browser</text>
  <!-- Vercel cluster -->
  <rect x="200" y="88" width="320" height="200" rx="10" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="220" y="110" fill="#a78bfa" font-size="11" font-weight="600">Vercel</text>
  <rect x="220" y="128" width="120" height="72" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="280" y="155" text-anchor="middle" fill="#e2e8f0" font-weight="600">Next.js 14</text>
  <text x="280" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">React + API routes</text>
  <rect x="360" y="128" width="120" height="72" rx="6" fill="#0f172a" stroke="#e879f9" stroke-width="1.2"/>
  <text x="420" y="155" text-anchor="middle" fill="#e2e8f0" font-weight="600">NextAuth</text>
  <text x="420" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">Google provider</text>
  <rect x="260" y="222" width="200" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="360" y="242" text-anchor="middle" fill="#cbd5e1" font-size="10">Prisma ORM ù API / watches / syncs</text>
  <text x="360" y="260" text-anchor="middle" fill="#64748b" font-size="9">(session cookie)</text>
  <!-- Google -->
  <rect x="600" y="100" width="120" height="100" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="660" y="145" text-anchor="middle" fill="#e2e8f0" font-weight="600">Google</text>
  <text x="660" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">OAuth 2.0 / ID token</text>
  <!-- Neon -->
  <rect x="600" y="232" width="120" height="64" rx="8" fill="#0f172a" stroke="#336791" stroke-width="1.2"/>
  <text x="660" y="260" text-anchor="middle" fill="#e2e8f0" font-weight="600">Neon</text>
  <text x="660" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">PostgreSQL</text>
  <!-- Arrows -->
  <path d="M 132 152 L 200 164" fill="none" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 132 160 L 360 200" fill="none" stroke="#c084fc" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M 480 164 L 600 150" fill="none" stroke="#f59e0b" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M 280 200 L 350 220" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
  <path d="M 400 200 L 370 222" fill="none" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="3 2"/>
  <path d="M 360 250 L 520 256 L 600 256" fill="none" stroke="#336791" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="24" y="300" fill="#475569" font-size="9">Regenerate high-res graph (optional): install Graphviz + pip install diagrams, then: python docs/diagrams/watch_drift_arch.py  see https://diagrams.mingrammer.com/docs/getting-started/examples</text>
</svg>
